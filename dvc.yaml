stages:
  preprocess:
    cmd: python3 src/modeling/preprocess.py params.yaml src/etl_pipeline/data/output/dataset.csv data/processed_training_data.csv data/processed_test_data.csv
    deps:
      - src/modeling/preprocess.py
      - src/etl_pipeline/data/output/dataset.csv
    outs:
      - data/processed_training_data.csv
      - data/processed_test_data.csv

  train:
    cmd: python3 src/modeling/train.py params.yaml data/processed_training_data.csv models/model.pkl
    deps:
      - src/modeling/train.py
      - data/processed_training_data.csv
    outs:
      - models/model.pkl
  
  evaluate:
    cmd: python3 src/modeling/evaluate.py params.yaml models/model.pkl data/processed_test_data.csv metrics/evaluation.json
    deps:
      - src/modeling/evaluate.py
      - models/model.pkl
      - data/processed_test_data.csv
    outs:
      - metrics/evaluation.json