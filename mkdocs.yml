site_name: TFM Air Quality Analysis Platform
site_description: Master's Thesis - Air Quality, Health and Socioeconomic Analysis Platform
site_author: TFM Air Quality Project
site_url: https://localhost:8000

# Repository
repo_name: tfm_air_quality
repo_url: https://github.com/alvarog2491/tfm_air_quality

# Configuration
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.code.select
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

# Plugins
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            merge_init_into_class: true
  - mermaid2

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: your-username
      repo: tfm_air_quality
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - Project Overview: getting-started/overview.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - System Architecture:
    - Platform Overview: architecture/platform-overview.md
    - Component Architecture: architecture/components.md
    - Data Flow: architecture/data-flow.md
  - ETL Pipeline:
    - Overview: etl-pipeline/overview.md
    - Getting Started: etl-pipeline/getting-started.md
    - Complete Documentation: etl-pipeline/ETL_PIPELINE_DOCUMENTATION.md
    - Components:
      - Extract Layer: etl-pipeline/components/extract.md
      - Transform Layer: etl-pipeline/components/transform.md
      - Load Layer: etl-pipeline/components/load.md
    - Configuration: etl-pipeline/configuration.md
    - Testing: etl-pipeline/testing.md
    - Troubleshooting: etl-pipeline/troubleshooting.md
  - ML Pipeline:
    - Overview: ml-pipeline/overview.md
    - Model Training: ml-pipeline/training.md
    - Model Evaluation: ml-pipeline/evaluation.md
    - Model Registry: ml-pipeline/registry.md
  - Web Application:
    - Overview: web-app/overview.md
    - API Endpoints: web-app/api.md
    - Deployment: web-app/deployment.md
  - Data Sources:
    - Overview: data-sources/overview.md
    - Air Quality Data: data-sources/air-quality.md
    - Health Data: data-sources/health.md
    - Socioeconomic Data: data-sources/socioeconomic.md
  - Development:
    - Contributing: development/contributing.md
    - Testing Strategy: development/testing.md
    - CI/CD Pipeline: development/cicd.md
  - Deployment:
    - Local Deployment: deployment/local.md
    - Docker Setup: deployment/docker.md
    - Production: deployment/production.md

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-username/tfm_air_quality
  version:
    provider: mike

# CSS
extra_css:
  - stylesheets/extra.css