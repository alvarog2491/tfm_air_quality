name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create required directories
      run: |
        mkdir -p data
        mkdir -p models
        mkdir -p metrics
        mkdir -p src/etl_pipeline/data/raw
        mkdir -p src/etl_pipeline/data/output
    
    - name: Run ETL Pipeline Tests
      run: |
        pytest src/etl_pipeline/tests/ -v --tb=short
    
    - name: Run Modeling Tests
      run: |
        pytest src/modeling/tests/ -v --tb=short
    
    - name: Run Integration Tests
      run: |
        pytest tests/integration/ -v --tb=short
    
    - name: Create test data for ETL pipeline
      run: |
        python tests/integration/create_test_data.py
    
    - name: Run ETL Pipeline
      run: |
        python src/etl_pipeline/main_orchestrator.py
    
    - name: Verify ETL Output
      run: |
        python tests/integration/verify_etl_output.py
    
    - name: Test Modeling Pipeline
      run: |
        dvc repro --force
    
    - name: Verify Modeling Output
      run: |
        python tests/integration/verify_modeling_output.py
    
    - name: Test App Functionality
      run: |
        python tests/integration/test_app_simple.py
    
    - name: Run End-to-End Integration Test
      run: |
        pytest tests/integration/test_end_to_end.py -v --tb=short
